unique_name: lab_budget_control
object_type: model
label: Lab Budget
description: >-
  Budget component on pg_composite_control using Model A's packaged Date.
relationships:
  - unique_name: lab_budget_to_date_control
    from:
      dataset: lab_fact_budget_control
      join_columns:
        - date_key
    to:
      dimension: Lab Date Control
      level: Date
metrics:
  - unique_name: m_budget_amount_sum_control
    folder: Lab Measures

